version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fastcode-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fastcode
      POSTGRES_USER: fastcode
      POSTGRES_PASSWORD: devpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastcode"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fastcode-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
